<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <!-- The consent page for AI clients (MCP_OAUTH.md). No inline script and no analytics:
       this page hands out access, so it runs only its own bundle and supabase-js. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Leathercraft CAD Web</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box;
      background:#1a1a1e; color:#d8d4cc; font:15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #consent { background:#222; border-radius:10px; padding:24px 28px; width:min(520px, 100%); box-sizing:border-box; }
    h1 { font-size:19px; color:#e8b44a; margin:0 0 14px; }
    .brand { font-size:12px; color:#888884; margin:0 0 6px; letter-spacing:.04em; }
    .asks { font-size:16px; color:#f0ece4; }
    dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0; }
    dt { color:#888884; font-size:13px; align-self:center; }
    dd { margin:0; overflow-wrap:anywhere; }
    .host { font-size:20px; font-weight:700; color:#f0ece4; font-family:ui-monospace, Menlo, monospace; }
    .host.bad { color:#ff8a7a; }
    .warn { background:#3a2620; border:1px solid #7a4030; border-radius:6px; padding:8px 12px; color:#f3c8bd; }
    .note { color:#a8a49c; font-size:13px; }
    ul { padding-left:22px; margin:4px 0 10px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    button { font:inherit; padding:8px 18px; border-radius:6px; border:1px solid #555; background:#2c2c33; color:#d8d4cc; cursor:pointer; }
    button.primary { background:#c8922a; border-color:#c8922a; color:#1a1a1e; font-weight:700; }
    button:disabled { opacity:.5; cursor:default; }
    .who { font-size:12px; color:#888884; margin:18px 0 0; }
    a { color:#e8b44a; }
  </style>
</head>
<body>
  <main id="consent"><p class="brand">Leathercraft CAD Web</p><p>…</p></main>
  <script type="module" src="consent.js?v=d0d78c2554"></script>
</body>
</html>
